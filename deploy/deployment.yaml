apiVersion: apps/v1
kind: Deployment
metadata:
  name: minecraft
  namespace: minecraft
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: minecraft
  template:
    metadata:
      labels:
        app: minecraft
    spec:
      volumes:
        - name: server-icon
          configMap:
            name: server-icon
            items:
              - key: servericon.png
                path: servericon.png
      containers:
        - name: minecraft
          image: itzg/minecraft-server:stable
          envFrom:
            - configMapRef:
                name: minecraft-config
          volumeMounts:
            - name: server-icon
              mountPath: /servericon.png
              subPath: servericon.png
              readOnly: true
