apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: minecraft

resources:
  - namespace.yaml
  - configmaps.yaml
  - secrets.yaml
  - statefulset-vanilla.yaml
  - statefulset-modded.yaml
  - configmap-velocity-vanilla.yaml
  - configmap-velocity-modded.yaml
  - configmap-fastlogin.yaml
  - statefulset-velocity-vanilla.yaml
  - statefulset-velocity-modded.yaml
  - ingress-modded.yaml
  - ingress-velocity-vanilla.yaml
  - ingress-velocity-modded.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: server-icon
    files:
      - servericon.png
