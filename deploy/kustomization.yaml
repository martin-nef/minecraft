apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: minecraft

resources:
  - namespace.yaml
  - secrets.yaml
  - statefulset-vanilla.yaml
  - statefulset-modded.yaml
  - statefulset-eminence.yaml
  - ingress-modded.yaml
  - ingress-vanilla.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: server-icon
    files:
      - servericon.png
  - name: solapplepie-config
    files:
      - solapplepie-server.toml=config/solapplepie-server.toml
