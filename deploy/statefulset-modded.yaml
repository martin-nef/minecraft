---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minecraft-modded
  namespace: minecraft
spec:
  replicas: 0
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  selector:
    matchLabels:
      app: minecraft-modded
  template:
    metadata:
      labels:
        app: minecraft-modded
      annotations:
        kubectl.kubernetes.io/restartedAt: "2026-05-25T3"
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - oci-big-1
      volumes:
        - name: server-icon
          configMap:
            name: server-icon
            items:
              - key: servericon.png
                path: servericon.png
        - name: solapplepie-config
          configMap:
            name: solapplepie-config
            items:
              - key: solapplepie-server.toml
                path: solapplepie-server.toml
      containers:
        - name: minecraft
          image: itzg/minecraft-server:stable-java17
          imagePullPolicy: Always
          resources:
            requests:
              memory: "13Gi"
            limits:
              memory: "13Gi"
          envFrom:
            - configMapRef:
                name: modded-config
            - secretRef:
                name: curseforge-secret
          volumeMounts:
            - name: server-icon
              mountPath: /servericon.png
              subPath: servericon.png
              readOnly: true
            - name: solapplepie-config
              mountPath: /config
              readOnly: true
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: "local-path"
        resources:
          requests:
            storage: 15Gi
---
apiVersion: v1
kind: Service
metadata:
  name: modded-service
  namespace: minecraft
  labels:
    app: minecraft-modded
spec:
  ports:
    - port: 25566
      name: modded
  clusterIP: None
  selector:
    app: minecraft-modded
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: modded-config
  namespace: minecraft
data:
  EULA: "TRUE"
  MEMORY: 10G
  SERVER_PORT: "25566"
  JVM_OPTS: "-XX:+UseG1GC -XX:+ParallelRefProcEnabled -XX:MaxGCPauseMillis=200 -XX:+UnlockExperimentalVMOptions -XX:+DisableExplicitGC -XX:+AlwaysPreTouch -XX:G1NewSizePercent=30 -XX:G1MaxNewSizePercent=40 -XX:G1HeapRegionSize=8M -XX:G1ReservePercent=20 -XX:G1HeapWastePercent=5 -XX:G1MixedGCCountTarget=4 -XX:InitiatingHeapOccupancyPercent=15 -XX:G1MixedGCLiveThresholdPercent=90 -XX:G1RSetUpdatingPauseTimePercent=5 -XX:SurvivorRatio=32 -XX:+PerfDisableSharedMem -XX:MaxTenuringThreshold=1 -Dfml.readTimeout=300 -Dfml.loginTimeout=12000"

  MODPACK_PLATFORM: AUTO_CURSEFORGE
  CF_API_KEY: ${CF_API_KEY}
  CF_PAGE_URL: https://www.curseforge.com/minecraft/modpacks/ciscos-adventure-rpg-ultimate
  MOTD: Cisco's Adventure RPG Ultimate
  ICON: "/servericon.png"
  OVERRIDE_ICON: "true"

  ENABLE_RCON: "true"
  RCON_PORT: "25575"
  RCON_PASSWORD: "safsdaf"
  ALLOW_FLIGHT: "true"
  # VIEW_DISTANCE: 10
  # SIMULATION_DISTANCE: 10

  # Mod-config override: files mounted at /config are copied into /data/config
  # at startup ("Copying any configs from /config to /data/config"), overwriting
  # the modpack's copy. NOT a subPath over /data/config (blocks the CurseForge
  # installer, "Device or resource busy", cf. packetfixer) and NOT APPLY_EXTRA_FILES
  # (which throws FileAlreadyExistsException when the modpack already ships the file).
  # Default skips files newer in the destination; force our /config to win so the
  # override survives a fresh modpack re-extract.
  SYNC_SKIP_NEWER_IN_DESTINATION: "false"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: packetfixer-config
  namespace: minecraft
data:
  packetfixer.properties: |
    utfSize=32767
    allSizesUnlimited=true
    forceUnlimitedNbtEnabled=false
    packetSize=104857600
    stringSize=32767
    timeout=300
    varInt=5
    varInt21=8
    chunkPacketData=2097152
    varLong=10
    nbtMaxSize=209715200
    decoderSize=838860800
