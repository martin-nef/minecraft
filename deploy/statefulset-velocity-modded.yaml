---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: velocity-modded
  namespace: minecraft
spec:
  replicas: 1
  selector:
    matchLabels:
      app: velocity-modded
  template:
    metadata:
      labels:
        app: velocity-modded
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - oci-big-1
      volumes:
        - name: velocity-config-src
          configMap:
            name: velocity-modded-config
            items:
              - key: velocity.toml
                path: velocity.toml
        - name: forwarding-secret-src
          secret:
            secretName: velocity-forwarding-secret
            items:
              - key: forwarding.secret
                path: forwarding.secret
        - name: fastlogin-config-src
          configMap:
            name: fastlogin-config
            items:
              - key: config.yml
                path: config.yml
        - name: server-data
          emptyDir: {}
      initContainers:
        - name: install-configs
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              set -e
              mkdir -p /server/plugins/fastlogin
              cp /etc/velocity-config/velocity.toml /server/velocity.toml
              cp /etc/forwarding-secret/forwarding.secret /server/forwarding.secret
              cp /etc/fastlogin-config/config.yml /server/plugins/fastlogin/config.yml
              chown -R 1000:1000 /server
              chmod 0600 /server/forwarding.secret
          volumeMounts:
            - name: velocity-config-src
              mountPath: /etc/velocity-config
              readOnly: true
            - name: forwarding-secret-src
              mountPath: /etc/forwarding-secret
              readOnly: true
            - name: fastlogin-config-src
              mountPath: /etc/fastlogin-config
              readOnly: true
            - name: server-data
              mountPath: /server
      containers:
        - name: velocity
          image: itzg/mc-proxy:latest
          imagePullPolicy: Always
          resources:
            requests:
              memory: "512Mi"
            limits:
              memory: "512Mi"
          env:
            - name: TYPE
              value: "VELOCITY"
            - name: MEMORY
              value: "384M"
            - name: PLUGINS
              value: "https://github.com/TuxCoding/FastLogin/releases/latest/download/FastLoginVelocity.jar"
          ports:
            - containerPort: 25577
              name: minecraft
          volumeMounts:
            - name: server-data
              mountPath: /server
---
apiVersion: v1
kind: Service
metadata:
  name: velocity-modded-service
  namespace: minecraft
  labels:
    app: velocity-modded
spec:
  ports:
    - port: 25577
      name: minecraft
  clusterIP: None
  selector:
    app: velocity-modded
