---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minecraft-atm
  namespace: minecraft
spec:
  replicas: 1
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  selector:
    matchLabels:
      app: minecraft-atm
  template:
    metadata:
      labels:
        app: minecraft-atm
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - shitbox
      volumes:
        - name: server-icon
          configMap:
            name: server-icon
            items:
              - key: servericon.png
                path: servericon.png
        - name: cf-downloads
          emptyDir: {}
      initContainers:
        # ATM10 bundles "unofficial cc:tweaked", whose author disallows automated
        # CurseForge downloads, which aborts the modpack install. The same build is
        # published on Modrinth with an open CDN, so stage it into the itzg
        # CF_DOWNLOADS_REPO (/downloads/mods). We fetch every neoforge build for the
        # target MC version, so whichever filename the pack pins is already present
        # after a pack update — no manual re-download needed.
        - name: stage-cc-tweaked
          image: python:3.12-alpine
          command: ["python3", "-c"]
          args:
            - |
              import json, os, urllib.request
              from urllib.parse import urlencode
              MC = os.environ.get("CC_MC_VERSION", "1.21.1")
              LOADER = os.environ.get("CC_LOADER", "neoforge")
              DEST = "/downloads/mods"
              UA = "minecraft-atm-init/1.0 (martin.nefjodov@gmail.com)"
              os.makedirs(DEST, exist_ok=True)
              q = urlencode({"loaders": '["%s"]' % LOADER, "game_versions": '["%s"]' % MC})
              api = "https://api.modrinth.com/v2/project/cc-tweaked/version?" + q
              req = urllib.request.Request(api, headers={"User-Agent": UA})
              versions = json.load(urllib.request.urlopen(req, timeout=30))
              n = 0
              for v in versions:
                  for f in v["files"]:
                      path = os.path.join(DEST, f["filename"])
                      if os.path.exists(path):
                          continue
                      print("downloading", f["filename"], flush=True)
                      r = urllib.request.Request(f["url"], headers={"User-Agent": UA})
                      with urllib.request.urlopen(r, timeout=180) as resp, open(path, "wb") as out:
                          out.write(resp.read())
                      n += 1
              print("cc-tweaked: staged %d file(s) for %s %s" % (n, LOADER, MC), flush=True)
          volumeMounts:
            - name: cf-downloads
              mountPath: /downloads
      containers:
        - name: minecraft
          image: itzg/minecraft-server:java21
          imagePullPolicy: Always
          resources:
            requests:
              memory: "10Gi"
              cpu: "2000m"
            limits:
              memory: "16Gi"
          envFrom:
            - configMapRef:
                name: atm-config
            - secretRef:
                name: curseforge-secret
          volumeMounts:
            - name: server-icon
              mountPath: /servericon.png
              subPath: servericon.png
              readOnly: true
            - name: data
              mountPath: /data
            - name: cf-downloads
              mountPath: /downloads
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: "local-path"
        resources:
          requests:
            storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: atm-service
  namespace: minecraft
  labels:
    app: minecraft-atm
spec:
  ports:
    - port: 25567
      name: atm
  clusterIP: None
  selector:
    app: minecraft-atm
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: atm-config
  namespace: minecraft
data:
  EULA: "TRUE"
  MEMORY: 10G
  SERVER_PORT: "25567"
  JVM_OPTS: "-XX:+UseG1GC -XX:+ParallelRefProcEnabled -XX:MaxGCPauseMillis=200 -XX:+UnlockExperimentalVMOptions -XX:+DisableExplicitGC -XX:+AlwaysPreTouch -XX:G1NewSizePercent=30 -XX:G1MaxNewSizePercent=40 -XX:G1HeapRegionSize=8M -XX:G1ReservePercent=20 -XX:G1HeapWastePercent=5 -XX:G1MixedGCCountTarget=4 -XX:InitiatingHeapOccupancyPercent=15 -XX:G1MixedGCLiveThresholdPercent=90 -XX:G1RSetUpdatingPauseTimePercent=5 -XX:SurvivorRatio=32 -XX:+PerfDisableSharedMem -XX:MaxTenuringThreshold=1 -Dfml.readTimeout=300 -Dfml.loginTimeout=12000"

  MODPACK_PLATFORM: AUTO_CURSEFORGE
  CF_API_KEY: ${CF_API_KEY}
  CF_PAGE_URL: https://www.curseforge.com/minecraft/modpacks/all-the-mods-10
  MOTD: "All The Mods 10"
  ICON: "/servericon.png"
  OVERRIDE_ICON: "true"

  ENABLE_RCON: "true"
  RCON_PORT: "25575"
  RCON_PASSWORD: "safsdaf"
  ALLOW_FLIGHT: "true"
  # VIEW_DISTANCE: 10
  # SIMULATION_DISTANCE: 10
