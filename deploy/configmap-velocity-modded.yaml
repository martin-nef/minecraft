---
apiVersion: v1
kind: ConfigMap
metadata:
  name: velocity-modded-config
  namespace: minecraft
data:
  velocity.toml: |
    config-version = "2.7"
    bind = "0.0.0.0:25577"
    motd = "<#ff8800>Cisco's Adventure RPG Ultimate (via Velocity)"
    show-max-players = 20
    online-mode = true
    force-key-authentication = true
    prevent-client-proxy-connections = false
    player-info-forwarding-mode = "modern"
    forwarding-secret-file = "/server/forwarding.secret"
    announce-forge = true
    kick-existing-players = false
    ping-passthrough = "DISABLED"
    sample-players-in-ping-response = true

    [servers]
    modded = "modded-service.minecraft.svc.cluster.local:25566"
    try = ["modded"]

    [forced-hosts]

    [advanced]
    compression-threshold = 256
    compression-level = -1
    login-ratelimit = 3000
    connection-timeout = 5000
    read-timeout = 300000
    haproxy-protocol = false
    tcp-fast-open = false
    bungee-plugin-message-channel = true
    show-ping-requests = false
    failover-on-unexpected-server-disconnect = true
    announce-proxy-commands = true
    log-command-executions = false
    log-player-connections = true

    [query]
    enabled = false
    port = 25577
    map = "Velocity"
    show-plugins = false
