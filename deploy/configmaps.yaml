---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vanilla-config
  namespace: minecraft
data:
  EULA: "TRUE"
  # MEMORY: 2G
  # TYPE: FABRIC
  # TYPE: "PAPER"
  # PLUGINS: "https://download.geysermc.org/v2/projects/geyser/versions/latest/builds/latest/downloads/spigot\nhttps://download.geysermc.org/v2/projects/floodgate/versions/latest/builds/latest/downloads/spigot"

  ENABLE_RCON: "true"
  RCON_PORT: "25575"
  RCON_PASSWORD: "safsdaf"

  ICON: "/servericon.png"
  OVERRIDE_ICON: "true"

  ALLOW_FLIGHT: "true"
  MOTD: Vanilla+
  # VIEW_DISTANCE: 10
  # SIMULATION_DISTANCE: 10
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: modded-config
  namespace: minecraft
data:
  EULA: "TRUE"
  MEMORY: 12G
  SERVER_PORT: "25566"
  JVM_OPTS: "-Dfml.readTimeout=300 -Dfml.loginTimeout=600"

  MODPACK_PLATFORM: AUTO_CURSEFORGE
  CF_API_KEY: ${CF_API_KEY}
  CF_PAGE_URL: https://www.curseforge.com/minecraft/modpacks/ciscos-adventure-rpg-ultimate
  MOTD: Cisco's Adventure RPG Ultimate
  ICON: "/servericon.png"
  OVERRIDE_ICON: "true"

  ENABLE_RCON: "true"
  RCON_PORT: "25575"
  RCON_PASSWORD: "safsdaf"
  ALLOW_FLIGHT: "true"
  # VIEW_DISTANCE: 10
  # SIMULATION_DISTANCE: 10
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: packetfixer-config
  namespace: minecraft
data:
  packetfixer.properties: |
    utfSize=32767
    allSizesUnlimited=true
    forceUnlimitedNbtEnabled=false
    packetSize=104857600
    stringSize=32767
    timeout=300
    varInt=5
    varInt21=8
    chunkPacketData=2097152
    varLong=10
    nbtMaxSize=209715200
    decoderSize=838860800
