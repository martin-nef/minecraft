---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minecraft
  namespace: minecraft
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minecraft
  template:
    metadata:
      labels:
        app: minecraft
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - oci-big-1
      volumes:
        - name: server-icon
          configMap:
            name: server-icon
            items:
              - key: servericon.png
                path: servericon.png
      containers:
        - name: minecraft
          image: itzg/minecraft-server:stable
          imagePullPolicy: Always
          resources:
            requests:
              memory: "1Gi"
              cpu: "1000m"
            limits:
              memory: "1Gi"
          envFrom:
            - configMapRef:
                name: vanilla-config
          volumeMounts:
            - name: server-icon
              mountPath: /servericon.png
              subPath: servericon.png
              readOnly: true
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: "local-path"
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: service
  namespace: minecraft
  labels:
    app: minecraft
spec:
  ports:
    - port: 25565
      name: minecraft
  clusterIP: None
  selector:
    app: minecraft
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vanilla-config
  namespace: minecraft
data:
  EULA: "TRUE"
  # MEMORY: 2G
  # TYPE: FABRIC
  # TYPE: "PAPER"
  # PLUGINS: "https://download.geysermc.org/v2/projects/geyser/versions/latest/builds/latest/downloads/spigot\nhttps://download.geysermc.org/v2/projects/floodgate/versions/latest/builds/latest/downloads/spigot"

  ENABLE_RCON: "true"
  RCON_PORT: "25575"
  RCON_PASSWORD: "safsdaf"

  ICON: "/servericon.png"
  OVERRIDE_ICON: "true"

  ALLOW_FLIGHT: "true"
  MOTD: Vanilla+
  # VIEW_DISTANCE: 10
  # SIMULATION_DISTANCE: 10
