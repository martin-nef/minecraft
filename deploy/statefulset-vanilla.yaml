---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minecraft
  namespace: minecraft
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minecraft
  template:
    metadata:
      labels:
        app: minecraft
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - oci-big-1
      volumes:
        - name: server-icon
          configMap:
            name: server-icon
            items:
              - key: servericon.png
                path: servericon.png
        - name: paper-global-config
          secret:
            secretName: velocity-forwarding-secret
            items:
              - key: paper-global.yml
                path: paper-global.yml
      initContainers:
        - name: install-paper-global
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              set -e
              mkdir -p /data/config
              chown -R 1000:1000 /data/config
              cp -f /etc/paper-config/paper-global.yml /data/config/paper-global.yml
              chown 1000:1000 /data/config/paper-global.yml
              chmod 0644 /data/config/paper-global.yml
          volumeMounts:
            - name: paper-global-config
              mountPath: /etc/paper-config
              readOnly: true
            - name: data
              mountPath: /data
      containers:
        - name: minecraft
          image: itzg/minecraft-server:stable
          imagePullPolicy: Always
          resources:
            requests:
              memory: "1Gi"
            limits:
              memory: "1Gi"
          envFrom:
            - configMapRef:
                name: vanilla-config
          volumeMounts:
            - name: server-icon
              mountPath: /servericon.png
              subPath: servericon.png
              readOnly: true
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: "local-path"
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: service
  namespace: minecraft
  labels:
    app: minecraft
spec:
  ports:
    - port: 25565
      name: minecraft
  clusterIP: None
  selector:
    app: minecraft
